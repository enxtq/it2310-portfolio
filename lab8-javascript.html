
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 8 - Interactive Button</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }

        button {
            font-size: 20px;
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px;
        }

        button:hover {
            background-color: #45a049;
        }

        #greeting {
            font-size: 22px;
            margin-top: 20px;
            color: #333;
        }
    </style>
</head>
<body>

    <h1>Welcome to My Page</h1>

    <!-- Your name (instead of document.write) -->
    <p>Created by: Adrian Peterson</p>

    <!-- Main button -->
    <button id="nameButton">Click Me!</button>

    <!-- Second bonus button -->
    <button id="alertButton">Show Alert</button>

    <!-- Greeting appears here -->
    <p id="greeting"></p>

    <script>
        // Select elements
        const nameButton = document.getElementById("nameButton");
        const alertButton = document.getElementById("alertButton");
        const greeting = document.getElementById("greeting");

        // Main button click event
        nameButton.addEventListener("click", () => {
            const user = prompt("What is your name?");

            if (user) {
                // Bonus: Display greeting in paragraph
                greeting.textContent = `Nice to meet you, ${user}! Welcome to my page.`;

                // Bonus: Change the button color when clicked
                nameButton.style.backgroundColor = "#FF9800";
            } else {
                greeting.textContent = "";
                nameButton.style.backgroundColor = "#4CAF50"; // reset default color
            }
        });

        // Bonus: Second button that shows an alert instead
        alertButton.addEventListener("click", () => {
            alert("This is a bonus alert message!");
        });
    </script>

</body>
</html>
